services:
  ai-service:
    build: .
    container_name: blender_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/app/storage
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - ANONYMOUS_TELEMETRY=False
      - GROQ_API_KEY="your groq_api_key_here"
      
